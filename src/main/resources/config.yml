# Geyser-Spigot と同じ Paper サーバーの plugins/ に入れる。
refresh-ticks: 100
# サーバー全体の1tick当たりの補完呼び出し上限。
queries-per-tick: 8
# 1回の外部プラグイン呼び出し自体を途中停止することはできない。
budget-millis-per-tick: 2.0
slow-query-millis: 10.0
# Bukkitの候補をたどる深さ。既存の型付きOverloadでは引数位置を直接探索する。
max-depth: 3
max-nodes-per-command: 32
max-candidates-per-node: 64
max-commands-per-player: 128
max-total-nodes-per-player: 256
max-total-candidates-per-player: 4096
max-branches-per-command: 64
max-candidate-length: 96
# Bedrockセレクターの旧引数をJava形式へ変換する（Geyser経由のBedrockユーザーのみ）。
# Java形式のdistance=やlimit=などはそのまま利用可能。/gnc reloadで反映。
selector-auto-convert: true
# 空なら原則すべてのコマンドで変換。必要なら対象のコマンド名を列挙。
selector-auto-convert-commands: []
# チャットなど、セレクターを単なる文字列として使うコマンドは除外。
selector-auto-convert-exclude-commands: [say, me, msg, tell, w, whisper, teammsg, tm, tellraw, title, broadcast, bc, r, reply, mail, help, gnc]
# 空なら、汎用コマンドとJava側に補完候補のあるSTRING引数を自動検出。
include-commands: []
exclude-commands: [geyser, gnc, help]
# 空入力では候補を返さないプラグイン向け。任意、既定では総当たりしない。
# prefix-probes: [a, b, c] とすると各引数位置で空候補だった場合だけ試す。
prefix-probes: []
# 候補から自動発見できない分岐を指定。文字列ごとに引数列として扱う。
# 例: /example delete の補完を先読みする。
extra-contexts: {}
#  example:
#    - delete
#    - 'admin remove'
